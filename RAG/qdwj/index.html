<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理咨询机器人</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* 顶部机器人 */
        .robot-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .robot-icon {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }

        .robot-icon::before {
            content: "🤖";
            font-size: 60px;
        }

        .title {
            margin-top: 20px;
            font-size: 30px;
            color: white;
            font-weight: bold;
        }

        .subtitle {
            color: white;
            margin-top: 5px;
        }

        .model-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
        }

        /* 聊天区域 */
        .chat-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }

        .chat-messages {
            height: 600px;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(180deg, #f5f3ff, #ffffff);
        }

        .message {
            max-width: 80%;
            margin-bottom: 15px;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 17px;
            line-height: 1.6;
        }

        /* 用户 */
        .user-message {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        /* AI 回答 */
        .ai-message {
            background: linear-gradient(135deg, #e0c3fc, #8ec5fc);
            color: #000;
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }

        /* 思考过程 */
        .reasoning-box {
            max-width: 80%;
            margin-right: auto;
            margin-bottom: 15px;
            background: #f5f5f5;
            border: 1px solid #d1d5db;
            border-radius: 15px;
            overflow: hidden;
            color: #6b7280;
        }

        .reasoning-title {
            padding: 12px 18px;
            background: #eeeeee;
            cursor: pointer;
            font-weight: bold;
            color: #4b5563;
            user-select: none;
        }

        .reasoning-content {
            padding: 12px 18px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 15px;
            /* 默认显示，通过 style 控制 */
        }

        /* 知识库 */
        .knowledge-section {
            max-width: 80%;
            margin-right: auto;
            margin-bottom: 15px;
            padding: 12px 18px;
            background: #f5f3ff;
            border-radius: 15px;
        }

        .knowledge-title {
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 10px;
        }

        .knowledge-item {
            background: white;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        /* 输入区域 */
        .input-area {
            display: flex;
            padding: 15px;
            gap: 10px;
            border-top: 1px solid #eee;
        }

        #user-input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 30px;
            border: 2px solid #c4b5fd;
            font-size: 17px;
        }

        #send-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        /* 加载动画 */
        .typing-indicator {
            display: flex;
            gap: 5px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #764ba2;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="robot-section">
        <div class="robot-icon"></div>
        <h1 class="title">💖 心理咨询机器人 💖</h1>
        <p class="subtitle">倾听你的心声，陪伴你成长</p>
        <span class="model-badge">🖥️ 本地模型: Qwen3-1.7B</span>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
            <div class="message ai-message">
                你好呀！我是你的心理咨询机器人 💝<br>
                有什么想聊的吗？我在这里听你说~
            </div>
        </div>

        <div class="input-area">
            <input id="user-input" placeholder="输入你的问题..." onkeydown="if(event.keyCode==13)sendMessage()">
            <button id="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("user-input");
            const chat = document.getElementById("chat-messages");
            const btn = document.getElementById("send-btn");

            const message = input.value.trim();
            if (!message) return;

            btn.disabled = true;

            // 用户消息
            const userDiv = document.createElement("div");
            userDiv.className = "message user-message";
            userDiv.textContent = message;
            chat.appendChild(userDiv);
            input.value = "";

            // 等待动画
            const loading = document.createElement("div");
            loading.className = "message ai-message";
            loading.textContent = "AI正在思考...";
            chat.appendChild(loading);
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch("/ai", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: `shuru=${encodeURIComponent(message)}`
                });

                // 删除等待
                chat.removeChild(loading);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                let reasoningBox = null;
                let reasoningContent = null;
                let answerBox = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value);
                    const lines = text.split("\n");

                    for (let line of lines) {
                        if (!line.startsWith("data:")) continue;

                        let json;
                        try {
                            json = JSON.parse(line.replace("data:", ""));
                        } catch (e) {
                            continue;
                        }

                        // =====================
                        // 思考过程
                        // =====================
                        if (json.type === "thinking") {
                            if (!reasoningBox) {
                                reasoningBox = document.createElement("div");
                                reasoningBox.className = "reasoning-box";
                                reasoningBox.innerHTML = `
                                    <div class="reasoning-title">
                                        🤔 思考过程（点击展开/关闭） ▲
                                    </div>
                                    <div class="reasoning-content"></div>
                                `;
                                reasoningContent = reasoningBox.querySelector(".reasoning-content");
                                // 默认展开
                                reasoningContent.style.display = "block";

                                const title = reasoningBox.querySelector(".reasoning-title");
                                title.onclick = function () {
                                    if (reasoningContent.style.display === "none") {
                                        reasoningContent.style.display = "block";
                                        title.innerHTML = "🤔 思考过程（点击展开/关闭） ▲";
                                    } else {
                                        reasoningContent.style.display = "none";
                                        title.innerHTML = "🤔 思考过程（点击展开/关闭） ▼";
                                    }
                                };

                                chat.appendChild(reasoningBox);
                            }
                            reasoningContent.textContent += json.content;
                        }

                        // =====================
                        // 正常答案
                        // =====================
                        if (json.type === "answer") {
                            if (!answerBox) {
                                answerBox = document.createElement("div");
                                answerBox.className = "message ai-message";
                                chat.appendChild(answerBox);
                            }
                            answerBox.textContent += json.content;
                        }

                        chat.scrollTop = chat.scrollHeight;
                    }
                }
            } catch (error) {
                const errorDiv = document.createElement("div");
                errorDiv.className = "message ai-message";
                errorDiv.textContent = "网络异常，请稍后再试~";
                chat.appendChild(errorDiv);
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
